
<div class="min-h-screen bg-slate-50 flex flex-col font-sans print:bg-white print:min-h-0 print:p-0">
  <!-- Top Executive Co-Branded Header (ILC + Client Logo) -->
  <app-header class="print:hidden"></app-header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 print:p-0 print:m-0 print:max-w-none print:w-full">
    <!-- Top KPIs (Hidden in Executive Report, Maintenance and Team views which have dedicated KPIs) -->
    <app-kpi-summary *ngIf="service.activeView() !== 'report' && service.activeView() !== 'maintenance' && service.activeView() !== 'team'"></app-kpi-summary>

    <!-- Filters & Search Bar (Hidden in Executive Report, Maintenance and Team views) -->
    <app-filters *ngIf="service.activeView() !== 'report' && service.activeView() !== 'maintenance' && service.activeView() !== 'team'"></app-filters>

    <!-- Loading State -->
    <div *ngIf="service.isLoading()" class="py-20 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
      <p class="mt-3 text-xs font-semibold text-slate-500">Carregando indicadores do portfólio ILC...</p>
    </div>

    <!-- Client Portal Error State -->
    <div *ngIf="service.clientPortalError()" class="my-12 p-8 max-w-lg mx-auto bg-white rounded-3xl border border-rose-200 shadow-xl text-center">
      <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-black">
        🔒
      </div>
      <h3 class="text-base font-extrabold text-slate-900 mb-1">Acesso Restrito ao Cliente</h3>
      <p class="text-xs text-slate-500 mb-5 leading-relaxed">{{ service.clientPortalError() }}</p>
      <a href="/" class="inline-block px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition">
        Voltar à Página Inicial
      </a>
    </div>

    <!-- Error State -->
    <div *ngIf="service.lastError() && !service.clientPortalError()" class="p-4 mb-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center justify-between">
      <span>{{ service.lastError() }}</span>
      <button (click)="service.loadPublicData()" class="font-bold underline">Tentar novamente</button>
    </div>

    <!-- Dynamic Views (only when not loading and no portal error) -->
    <div *ngIf="!service.isLoading() && !service.clientPortalError()">
      <!-- 1. Visão Macro (Portfólio - Régua Percentual 0% a 100%) -->
      <app-portfolio-macro *ngIf="service.activeView() === 'macro'"></app-portfolio-macro>

      <!-- 2. Cronograma EAP (Gantt Detalhado Fiel à Imagem de Referência) -->
      <app-eap-gantt *ngIf="service.activeView() === 'eap-gantt'"></app-eap-gantt>

      <!-- 3. Cards Executivos -->
      <app-project-cards *ngIf="service.activeView() === 'cards'"></app-project-cards>

      <!-- 4. Tabela Consolidada -->
      <app-project-table *ngIf="service.activeView() === 'table'"></app-project-table>

      <!-- 5. Status Report Executivo (Reunião de Diretoria) -->
      <app-executive-report *ngIf="service.activeView() === 'report'"></app-executive-report>

      <!-- 6. Painel de Sustentação & Manutenção -->
      <app-maintenance-dashboard *ngIf="service.activeView() === 'maintenance'"></app-maintenance-dashboard>

      <!-- 7. Análise & Alocação de Equipe -->
      <app-team-allocation *ngIf="service.activeView() === 'team'"></app-team-allocation>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 print:hidden">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span class="flex items-center gap-2">
        <strong>ILC - Integrator Logistics Company</strong> • Painel Executivo de Projetos
      </span>
      <span class="text-slate-400">Arquitetura Integrada Angular & Azure DevOps</span>
    </div>
  </footer>

  <!-- Curator / Admin Drawer Modal -->
  <app-curator-modal class="print:hidden"></app-curator-modal>
</div>
